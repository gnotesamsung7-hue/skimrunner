name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the game into the app (stamps the build number)
        run: |
          mkdir -p android/app/src/main/assets
          sed "s/__BUILD__/${{ github.run_number }}/" index.html > android/app/src/main/assets/index.html
          curl -fsSL -o android/app/src/main/assets/three.min.js https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js

      - name: Unpack the signing key from GitHub Secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Missing secrets KEYSTORE_BASE64 and/or KEYSTORE_PASSWORD. See README step 2."
            exit 1
          fi
          echo "$KS_B64" | tr -d '\r\n ' | base64 -d > android/app/release.p12
          ALIAS=$(keytool -list -storetype pkcs12 -keystore android/app/release.p12 -storepass "$KS_PASS" | grep -i 'PrivateKeyEntry' | head -n1 | cut -d, -f1)
          if [ -z "$ALIAS" ]; then echo "::error::Could not open the keystore - check KEYSTORE_PASSWORD."; exit 1; fi
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "Signing with key alias: $ALIAS"

      - name: Build signed release APK
        working-directory: android
        env:
          BUILD_NUM: ${{ github.run_number }}
          KS_PATH: release.p12
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk skimrunner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skimrunner-apk
          path: skimrunner.apk

      - name: Publish as the latest release (the QR code points here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SkimRunner v1.0.${{ github.run_number }}
          files: skimrunner.apk
          make_latest: true
